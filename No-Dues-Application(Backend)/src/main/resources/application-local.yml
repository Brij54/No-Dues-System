# =========================================================================
# LOCAL SPRING PROFILE CONFIGURATION (application-local.yml)
# =========================================================================

spring:
  jpa:
    hibernate:
      ddl-auto: update  # Automatically update DB schema in development
    show-sql: true
    properties:
      hibernate:
        format_sql: true  # Format SQL statements nicely in the logs

# Detailed Debug Logging for Local Development
logging:
  level:
    root: INFO
    com.example.no_due_v10: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
